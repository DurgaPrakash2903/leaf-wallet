<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10231D"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Leaf Wallet – money, cash and who owes you</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0E8;--card:#fff;--ink:#10231D;--mute:#68766F;--lime:#D4F25A;--ok:#1E9E5A;--warn:#E8A200;--bad:#D9382B;--line:#10231D;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0B1612;--card:#14251F;--ink:#EAF1EC;--mute:#8CA096;--line:#EAF1EC}}
:root[data-theme=dark]{--bg:#0B1612;--card:#14251F;--ink:#EAF1EC;--mute:#8CA096;--line:#EAF1EC}:root[data-theme=light]{--bg:#EEF0E8;--card:#fff;--ink:#10231D;--mute:#68766F;--line:#10231D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}input,select{user-select:text}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 15px 'DM Sans',sans-serif;overflow-x:hidden}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;padding-top:var(--st);overflow:hidden}
@media(min-width:500px){#app{height:min(860px,96%);margin:auto;border:2px solid var(--line);border-radius:28px}}
h1,h2,h3,.n{font-family:'Bricolage Grotesque',sans-serif;margin:0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#v{flex:1;overflow-y:auto;padding:18px 18px 130px}
.pg{animation:in .3s ease-out}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:3px 3px 0 var(--line)}
.dark{background:var(--ink);color:var(--bg);box-shadow:3px 3px 0 var(--lime)}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1}.mute{color:var(--mute);font-size:13px}.dark .mute{color:#9fb5aa}
.big{font-size:44px;font-weight:800;line-height:1}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.split div{border:1.5px solid #ffffff44;border-radius:12px;padding:10px}
.dot{width:38px;height:38px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font:800 15px 'Bricolage Grotesque';flex:none}
.tx{padding:10px 0;border-bottom:1.5px dashed #8886}.tx:last-child{border:0}
.bar{height:12px;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.over{border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}.over .bar i{animation:pl 1s infinite}.shake{animation:sh .5s}
@keyframes pl{50%{opacity:.5}}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.alert{background:var(--bad);color:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700;margin-bottom:14px}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:var(--card);border-top:2px solid var(--line);padding:8px 4px calc(8px + var(--sb))}
.nav button{background:none;border:0;color:var(--mute);font:700 12px 'DM Sans';min-width:62px;min-height:44px;padding:6px}.nav button.on{color:var(--ink);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-color:var(--lime)}
.nav .qr{width:62px;height:62px;border-radius:18px;background:var(--lime);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);margin-top:-30px;display:grid;place-items:center;color:var(--ink)}
button{cursor:pointer;color:inherit;font-family:inherit}button:active{transform:translate(2px,2px)}
.btn{width:100%;min-height:50px;background:var(--lime);color:#10231D;border:2px solid var(--line);border-radius:14px;font:800 16px 'Bricolage Grotesque';box-shadow:3px 3px 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink)}.btn.bad{background:var(--bad);color:#fff}.btn.sm{min-height:38px;font-size:14px;width:auto;padding:0 14px;box-shadow:2px 2px 0 var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:8px 12px;font:700 13px 'DM Sans'}.chip.on{background:var(--lime);color:#10231D}
input,select{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 15px 'DM Sans';margin:5px 0}
.amt{font:800 38px 'Bricolage Grotesque';border:0;border-bottom:2px solid var(--line);border-radius:0;text-align:center}
textarea{width:100%;height:90px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:12px monospace;padding:10px;user-select:text}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:12px}.bars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}.bars i{display:block;width:100%;min-height:2px;background:var(--ink);border-radius:6px 6px 0 0;height:0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
label{font-weight:700;font-size:13px}
#scrim{position:absolute;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.25s;z-index:5}#scrim.on{opacity:1;pointer-events:auto}
#sh{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--sb));transform:translateY(105%);transition:transform .4s cubic-bezier(.3,1.2,.5,1);z-index:6;max-height:92%;overflow-y:auto}#sh.on{transform:none}
#t{position:absolute;top:calc(12px + var(--st));left:16px;right:16px;background:var(--ink);color:var(--bg);border:2px solid var(--lime);padding:12px 14px;border-radius:14px;z-index:50;transform:translateY(-160%);transition:.35s cubic-bezier(.3,1.3,.5,1);font-weight:700}#t.on{transform:none}#t.bad{background:var(--bad);color:#fff}
.cf{position:absolute;top:0;width:9px;height:9px;z-index:20;animation:fl 1.6s ease-in forwards}@keyframes fl{to{transform:translateY(900px) rotate(600deg);opacity:0}}
.auth{padding:40px 22px;display:flex;flex-direction:column;justify-content:center;min-height:100%}
#reader{border:2px solid var(--line);border-radius:14px;overflow:hidden}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"><div id="t"></div><div id="v"></div><nav class="nav" id="nav" hidden></nav><div id="scrim"></div><div id="sh"></div></div>
<script>
const CATS=[["Food","#F2994A"],["Transport","#56B4E9"],["Rent","#9B8CFF"],["Bills","#F2C94C"],["Shopping","#F27BA5"],["Health","#4CC38A"],["Fun","#7DD3C0"],["Other","#B0B8B3"]];
const cc=n=>(CATS.find(c=>c[0]===n)||CATS[7])[1];
const LEAF='<svg width="34" height="34" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none"><path style="fill:var(--lime)" d="M5 19C5 10 10 5 20 4c0 10-5 15-14 15z"/><path d="M5 19c2-5 5-8 9-10"/></svg>';
const QRI='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const $=s=>document.querySelector(s),inr=n=>(n<0?"-":"")+"₹"+Math.round(Math.abs(n)).toLocaleString("en-IN");
const today=()=>new Date().toISOString().slice(0,10),mk=d=>d.slice(0,7);
let U=null,S=null,tab="home",tt,form={};
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const save=()=>ls("hd_"+U.email,S);
async function hash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hisaab"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function toast(m,bad){const e=$("#t");e.textContent=m;e.className="on"+(bad?" bad":"");clearTimeout(tt);tt=setTimeout(()=>e.className="",3000);if(bad&&navigator.vibrate)navigator.vibrate([120,60,120])}
function sheet(h){$("#sh").innerHTML=h;$("#sh").classList.add("on");$("#scrim").classList.add("on")}
function closeSheet(){$("#sh").classList.remove("on");$("#scrim").classList.remove("on")}$("#scrim").onclick=closeSheet;
function confetti(){const c=["#D4F25A","#10231D","#1E9E5A","#F2994A"];for(let i=0;i<36;i++){const e=document.createElement("i");e.className="cf";e.style.cssText=`left:${Math.random()*100}%;background:${c[i%4]};animation-delay:${Math.random()*.4}s`;$("#app").appendChild(e);setTimeout(()=>e.remove(),2200)}}
function countUp(){document.querySelectorAll("[data-n]").forEach(el=>{const to=+el.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800);el.textContent=inr(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
// ===== Auth =====
function authView(mode){$("#nav").hidden=true;$("#v").innerHTML=`<div class="auth pg">${LEAF}<h1 style="font-size:46px;line-height:1;margin-top:10px">Leaf Wallet.</h1><p class="mute" style="margin:8px 0 24px">Your money, your cash, and everyone who owes you.</p>${mode==="up"?'<input id="nm" placeholder="Your name">':""}<input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="${mode==="up"?"new":"current"}-password"><br><button class="btn" onclick="${mode==="up"?"signup()":"login()"}">${mode==="up"?"Create account":"Log in"}</button><p style="text-align:center"><a href="#" onclick="authView('${mode==="up"?"in":"up"}');return false" style="color:var(--ink);font-weight:700">${mode==="up"?"I already have an account":"New here? Sign up"}</a></p><p class="mute" style="text-align:center">Accounts are stored only on this device.</p></div>`}
async function signup(){const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value,nm=$("#nm").value.trim();if(!nm||!/\S+@\S+\.\S+/.test(em)||pw.length<6)return toast("Enter name, a valid email and 6+ character password",1);const us=ls("hu")||{};if(us[em])return toast("That email already has an account. Log in instead.",1);us[em]={name:nm,h:await hash(pw)};ls("hu",us);ls("hs",em);start(em)}
async function login(){const em=$("#em").value.trim().toLowerCase(),us=ls("hu")||{};if(!us[em]||us[em].h!==await hash($("#pw").value))return toast("Wrong email or password",1);ls("hs",em);start(em)}
function logout(){ls("hs",null);closeSheet();U=S=null;authView("in")}
function start(em){const us=ls("hu");U={email:em,name:us[em].name};S=ls("hd_"+em);if(!S){S={setup:false,bank:0,cash:0,total:15000,budgets:{},tx:[],loans:[],pending:null};save()}
 CATS.length=8;(S.cats||[]).forEach(x=>CATS.push([x.n,x.c]));S.setup?(runRec(),nav(),render(),remind(true)):setupView();S.pin&&lock()}
function setupView(){$("#nav").hidden=true;$("#v").innerHTML=`<div class="auth pg"><h2 style="font-size:32px">Hi ${U.name.split(" ")[0]}, let's set your starting money.</h2><p class="mute" style="margin:8px 0 20px">You can change these later.</p><label>Amount in your bank account (₹)</label><input id="b" type="number" inputmode="decimal" placeholder="0"><label>Cash in hand (₹)</label><input id="c" type="number" inputmode="decimal" placeholder="0"><br><button class="btn" onclick="doSetup()">Start tracking</button></div>`}
function doSetup(){const b=+$("#b").value||0,c=+$("#c").value||0;if(b<0||c<0)return toast("Amounts can't be negative",1);S.bank=b;S.cash=c;S.setup=true;save();nav();render()}
// ===== Money logic =====
const mTx=()=>S.tx.filter(t=>t.type!=="in"&&t.status==="paid"&&mk(t.date)===mk(today()));
const spentBy=c=>mTx().filter(t=>t.cat===c).reduce((a,t)=>a+t.amt,0),spent=()=>mTx().reduce((a,t)=>a+t.amt,0);
const bal=(src,d)=>{src==="Cash"?S.cash+=d:S.bank+=d};
const repaid=l=>l.pay.reduce((a,p)=>a+p.amt,0),left=l=>l.amt-repaid(l);
const L=k=>S.loans.filter(l=>(l.k||"l")===k),open=(k="l")=>L(k).filter(l=>left(l)>0),owed=(k="l")=>open(k).reduce((a,l)=>a+left(l),0);
const days=l=>l.due?Math.round((new Date(l.due)-new Date(today()))/864e5):null;
const col=p=>p>=1?"var(--bad)":p>=.7?"var(--warn)":"var(--ok)";
function checkBudget(c,b,a){const lim=S.budgets[c];if(lim){if(b<lim&&a>=lim)toast(`${c} budget exceeded by ${inr(a-lim)}`,1);else if(b<lim*.8&&a>=lim*.8)toast(`${c} is at ${Math.round(a/lim*100)}% of budget`)}if(b+0<S.total&&spent()>=S.total&&a>0)toast("Monthly budget exceeded",1)}
function addExp(t){const b=spentBy(t.cat);S.tx.push(t);if(t.status==="paid"){bal(t.method==="Cash"?"Cash":"Bank",-t.amt);checkBudget(t.cat,b,b+t.amt)}save()}
function remind(first){const o=[...open("l"),...open("b")].filter(l=>days(l)!==null&&days(l)<=1);if(first&&o.length)toast(`${o.length} reminder${o.length>1?"s":""}: ${o[0].k==="b"?"you owe "+o[0].who:o[0].who+" owes you"} ${inr(left(o[0]))}`,1)}
// ===== Nav / views =====
function nav(){const n=$("#nav");n.hidden=false;n.innerHTML=[["home","Home"],["tx","Activity"],["scan"],["lent","People"],["budget","Budget"]].map(([k,l])=>k==="scan"?`<button class="qr" onclick="openAdd()" aria-label="Add transaction">${QRI}</button>`:`<button class="${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(k){tab=k;nav();render()}
function txRow(t){const c=t.type==="in"?"#4CC38A":cc(t.cat);return`<div class="tx row"><div class="dot" style="background:${c}">${t.cat[0]}</div><div class="sp"><b>${t.note||t.cat}</b><div class="mute">${t.cat} · ${t.method||"Bank"} · ${t.date}${t.status==="pending"?" · pending":""}</div></div><b class="n">${t.type==="in"?"+":"-"}${inr(t.amt)}</b></div>`}
function render(){const v=$("#v");let h="";
 if(tab==="home"){const od=open().filter(l=>days(l)!==null&&days(l)<0),ob=open("b").filter(l=>days(l)!==null&&days(l)<0),DL=dailyInfo(),cats=CATS.map(c=>[c,spentBy(c[0])]).filter(x=>x[1]),tot=spent();
  h=`<div class="pg"><div class="row" style="margin-bottom:16px"><span style="display:flex">${LEAF}</span><h2 class="sp">Hi, ${U.name.split(" ")[0]}</h2><button class="chip" onclick="me()">Account</button></div>
  ${od.length?`<div class="alert">${od.length} overdue: ${od.map(l=>l.who).join(", ")} still owe you ${inr(od.reduce((a,l)=>a+left(l),0))}</div>`:""}
  ${ob.length?`<div class="alert">Overdue: you owe ${ob.map(l=>l.who).join(", ")} ${inr(ob.reduce((a,l)=>a+left(l),0))}</div>`:""}
  ${spent()>=S.total?`<div class="alert">Over your monthly budget by ${inr(spent()-S.total)}</div>`:""}
  <div class="box dark"><div class="mute">Total money you hold</div><div class="big n" data-n="${S.bank+S.cash}">₹0</div><div class="split"><div><span class="mute">In bank</span><br><b class="n" style="font-size:20px">${inr(S.bank)}</b></div><div><span class="mute">Cash in hand</span><br><b class="n" style="font-size:20px">${inr(S.cash)}</b></div></div></div>
  <div class="box ${DL.rem<0?"over":""}"><div class="mute">${DL.rem<0?"Over today's limit by":"Safe to spend today"}</div><div class="row"><b class="n" style="font-size:28px;color:${DL.rem<0?"var(--bad)":"inherit"}">${inr(Math.abs(DL.rem))}</b><span class="mute sp" style="text-align:right">${inr(Math.max(0,DL.allow))} daily limit</span></div></div>
  <div class="box row" onclick="go('lent')"><div class="sp"><div class="mute">Others owe you</div><b class="n" style="font-size:26px">${inr(owed())}</b></div><div class="mute" style="text-align:right">${open().length} open →${open("b").length?`<br>You owe ${inr(owed("b"))}`:""}</div></div>
  <div class="box"><div class="row"><b class="sp">Spent this month</b><b class="n">${inr(spent())}</b></div><div class="bar" style="display:flex">${cats.map(([c,v])=>`<i style="width:${v/tot*100}%;background:${c[1]};border-radius:0"></i>`).join("")||""}</div><div class="chips">${cats.map(([c,v])=>`<span class="mute"><b style="color:${c[1]}">●</b> ${c[0]} ${inr(v)}</span>`).join("")||'<span class="mute">Nothing yet. Tap the + button to add one.</span>'}</div></div>
  ${trendBox()}<div class="box"><b>Recent</b>${S.tx.slice(-4).reverse().map(txRow).join("")||'<div class="mute" style="padding:10px 0">No transactions yet.</div>'}<br><button class="btn sm" onclick="openAdd()">+ Add expense or income</button></div></div>`}
 if(tab==="tx"){const q=window._q||"";h=`<div class="pg"><h2 style="margin-bottom:10px">Activity</h2><input placeholder="Search" value="${q}" oninput="window._q=this.value;render();$('#v input').focus()"><div class="box">${S.tx.slice().reverse().filter(t=>((t.note||"")+t.cat).toLowerCase().includes(q.toLowerCase())).map(t=>`<div onclick="editTx(${t.id})">${txRow(t)}</div>`).join("")||'<div class="mute">Nothing here yet.</div>'}</div><div class="mute" style="text-align:center">Tap a row to edit or delete it</div></div>`}
 if(tab==="lent"){const k=window._k||"l",B=k==="b",lo=open(k).sort((a,b)=>(days(a)??999)-(days(b)??999)),dn=L(k).filter(l=>left(l)<=0);
  h=`<div class="pg"><div class="row" style="margin-bottom:12px"><button class="chip ${B?"":"on"}" onclick="window._k='l';render()">Lent to others</button><button class="chip ${B?"on":""}" onclick="window._k='b';render()">I borrowed</button></div><div class="box dark"><div class="mute">${B?"Total you owe":"Total to get back"}</div><div class="big n" data-n="${owed(k)}">₹0</div></div><button class="btn" onclick="lendSheet()">${B?"+ Record money borrowed":"+ Record money lent"}</button><br><br>${B?"":`<div class="row" style="margin-bottom:14px"><button class="btn sm alt" onclick="splitSheet()">Split a bill</button><button class="btn sm alt" onclick="shareOwed()">Share who owes me</button></div>`}
  ${lo.map(l=>{const d=days(l),st=d===null?"No due date":d<0?`Overdue by ${-d} day${-d>1?"s":""}`:d===0?"Due today":`Due in ${d} day${d>1?"s":""}`;return`<div class="box ${d!==null&&d<0?"over":""}"><div class="row"><div class="dot" style="background:var(--lime);color:#10231D">${l.who[0].toUpperCase()}</div><div class="sp"><b>${l.who}</b><div class="mute">${st} · ${B?"borrowed":"lent"} ${l.date}</div></div><b class="n" style="font-size:20px">${inr(left(l))}</b></div>${l.note?`<div class="mute" style="margin-top:6px">${l.note}</div>`:""}${l.pay.length?`<div class="mute" style="margin-top:6px">${B?"Paid back":"Received"} ${inr(repaid(l))} of ${inr(l.amt)}</div>`:""}<div class="row" style="margin-top:10px"><button class="btn sm" onclick="recvSheet(${l.id})">${B?"Paid back":"Got money"}</button>${B?"":`<button class="btn sm alt" onclick="nudge(${l.id})">Remind</button>`}<button class="btn sm alt" onclick="delLoan(${l.id})">Delete</button></div></div>`}).join("")||`<div class="box mute">${B?"You don't owe anyone right now.":"Nobody owes you anything right now."}</div>`}
  ${dn.length?`<h3 style="margin:8px 0">Settled</h3>${dn.map(l=>`<div class="box row"><b class="sp">${l.who}</b><span class="mute">${inr(l.amt)} ${B?"paid back":"received"}</span></div>`).join("")}`:""}</div>`}
 if(tab==="budget"){const rows=[["Overall",S.total,spent()]].concat(CATS.filter(c=>c[0]!=="Other").map(c=>[c[0],S.budgets[c[0]]||0,spentBy(c[0])]));
  h=`<div class="pg"><h2 style="margin-bottom:12px">Budgets</h2>${rows.map(([n,b,s])=>{const p=b?s/b:0;return`<div class="box ${p>=1?"over shake":""}" onclick="editB('${n}')"><div class="row"><b class="sp">${n}</b><span class="mute">${b?inr(s)+" of "+inr(b):"Tap to set a limit"}</span></div>${b?`<div class="bar"><i data-w="${Math.min(100,p*100)}" style="background:${col(p)}"></i></div>${p>=1?`<div style="color:var(--bad);font-weight:700;margin-top:8px">${inr(s-b)} over budget</div>`:p>=.7?`<div style="color:var(--warn);font-weight:700;margin-top:8px">${Math.round(p*100)}% used</div>`:""}`:""}</div>`}).join("")}${goalsHtml()}</div>`}
 v.innerHTML=h;if(tab==="home"||tab==="lent")countUp();setTimeout(()=>{document.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");document.querySelectorAll("[data-h]").forEach(e=>e.style.height=e.dataset.h+"%")},40)}
function me(){sheet(`<h3>${U.name}</h3><p class="mute">${U.email}</p><label>Bank balance (₹)</label><input id="b" type="number" value="${Math.round(S.bank)}"><label>Cash in hand (₹)</label><input id="c" type="number" value="${Math.round(S.cash)}"><br><button class="btn" onclick="S.bank=+$('#b').value||0;S.cash=+$('#c').value||0;save();closeSheet();render()">Update balances</button><br><br><button class="btn alt" onclick="toggleTheme()">Switch light / dark mode</button><br><br><button class="btn alt" onclick="pinSheet()">App lock (PIN)</button><br><br><button class="btn alt" onclick="catSheet()">Custom categories</button><br><br><button class="btn alt" onclick="recSheet()">Recurring expenses</button><br><br><button class="btn alt" onclick="backSheet()">Backup and restore</button><br><br><button class="btn alt" onclick="csv()">Export CSV</button><br><br><button class="btn alt" onclick="logout()">Log out</button>`)}
function csv(){const c="date,type,category,note,method,amount,status\n"+S.tx.map(t=>[t.date,t.type||"out",t.cat,'"'+(t.note||"")+'"',t.method||"Bank",t.amt,t.status].join(",")).join("\n");const a=document.createElement("a");a.href="data:text/csv,"+encodeURIComponent(c);a.download="leaf-wallet.csv";a.click()}
function delTx(id){const t=S.tx.find(x=>x.id===id);if(t&&confirm("Delete this transaction?")){if(t.status==="paid")bal(t.method==="Cash"?"Cash":"Bank",t.type==="in"?-t.amt:t.amt);S.tx=S.tx.filter(x=>x!==t);save();render()}}
function editB(n){sheet(`<h3>${n} budget</h3><input id="bv" type="number" inputmode="numeric" value="${(n==="Overall"?S.total:S.budgets[n])||""}" placeholder="Monthly limit in ₹"><br><button class="btn" onclick="setB('${n}')">Save</button>`)}
function setB(n){const v=+$("#bv").value;if(!(v>0))return toast("Enter an amount above 0",1);n==="Overall"?S.total=v:S.budgets[n]=v;save();closeSheet();render()}
// ===== Split bills and sharing =====
function splitSheet(){form={cat:"Food"};sheet(`<h3>Split a bill</h3><p class="mute">You paid the full bill. Your share is saved as an expense and each friend's share is saved as money they owe you.</p><input id="a" class="amt" type="number" inputmode="decimal" placeholder="Total bill ₹0"><input id="n" placeholder="What was it for? (e.g. Dinner)"><input id="fr" placeholder="Friends' names, separated by commas"><label>Category</label>${chips()}<label>Ask them to pay by (optional)</label><input id="du" type="date" min="${today()}"><label>You paid from</label><select id="m"><option>Bank</option><option>Cash</option></select><br><button class="btn" onclick="saveSplit()">Split equally</button>`)}
function saveSplit(){const a=+$("#a").value,names=$("#fr").value.split(",").map(x=>x.trim()).filter(Boolean);if(!(a>0)||!names.length)return toast("Enter the total and at least one friend's name",1);const m=$("#m").value,note=$("#n").value.trim()||form.cat,sh=Math.round(a/(names.length+1)*100)/100,du=$("#du").value;
 addExp({id:Date.now(),amt:sh,cat:form.cat,note:note+" (my share)",date:today(),method:m,status:"paid"});
 names.forEach((w,i)=>{S.loans.push({id:Date.now()+i+1,who:w,phone:"",amt:sh,date:today(),due:du,note:note+" (split)",src:m,pay:[],k:"l"});bal(m,-sh)});
 save();closeSheet();window._k="l";toast(`Split ${inr(a)}: ${names.length} friend${names.length>1?"s":""} owe you ${inr(sh)} each`);go("lent")}
function shareOwed(){const o=open("l");if(!o.length)return toast("Nobody owes you anything right now");const t="Money owed to me:\n"+o.map(l=>`${l.who}: ${inr(left(l))}${l.due?" (due "+l.due+")":""}`).join("\n")+`\nTotal: ${inr(owed())}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else{const e=document.createElement("textarea");e.value=t;document.body.appendChild(e);e.select();document.execCommand("copy");e.remove();toast("Summary copied")}}
// ===== Theme and app lock =====
function theme(m){const r=document.documentElement;m?r.dataset.theme=m:delete r.dataset.theme}
function toggleTheme(){const dark=(document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark",m=dark?"light":"dark";theme(m);ls("ht",m);closeSheet()}
function lock(){if($("#lock"))return;const d=document.createElement("div");d.id="lock";d.style.cssText="position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center";d.innerHTML=`${LEAF}<h2 style="margin:12px 0 4px">Leaf Wallet is locked</h2><p class="mute">Enter your 4-digit PIN</p><input id="lp" type="password" inputmode="numeric" maxlength="4" autocomplete="off" style="text-align:center;font-size:28px;letter-spacing:12px;max-width:200px"><br><button class="chip" onclick="logout();$('#lock')?.remove()">Forgot PIN? Log out</button>`;$("#app").appendChild(d);const i=$("#lp");i.focus();i.oninput=async()=>{if(i.value.length===4){if(await hash("pin"+i.value)===S.pin)d.remove();else{i.value="";toast("Wrong PIN",1)}}}}
function pinSheet(){sheet(S.pin?`<h3>App lock is on</h3><p class="mute">Leaf Wallet asks for your PIN when you open it or come back after a while.</p><button class="btn alt" onclick="S.pin=null;save();closeSheet();toast('App lock removed')">Remove PIN</button>`:`<h3>Set an app lock</h3><p class="mute">Choose a 4-digit PIN. If you forget it, log out and log back in with your password.</p><input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" style="text-align:center;font-size:24px;letter-spacing:10px"><br><button class="btn" onclick="setPin()">Turn on lock</button>`)}
async function setPin(){const p=$("#pn").value;if(!/^\d{4}$/.test(p))return toast("PIN must be exactly 4 digits",1);S.pin=await hash("pin"+p);save();closeSheet();toast("App lock is on")}
let away=0;document.addEventListener("visibilitychange",()=>{if(!S||!S.pin)return;if(document.hidden)away=Date.now();else if(Date.now()-away>20000)lock()});
// ===== Insights, goals, categories =====
function dailyInfo(){const n=new Date(),dl=new Date(n.getFullYear(),n.getMonth()+1,0).getDate()-n.getDate()+1,ts=mTx().filter(t=>t.date===today()).reduce((a,t)=>a+t.amt,0),allow=(S.total-(spent()-ts))/dl;return{allow,rem:allow-ts}}
function trendBox(){const M=window._tr==="m",ex=S.tx.filter(t=>t.type!=="in"&&t.status==="paid"),n=new Date(),pts=[];
 if(M){for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");pts.push([d.toLocaleString("en-IN",{month:"short"}),ex.filter(t=>mk(t.date)===k).reduce((a,t)=>a+t.amt,0)])}}
 else{for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=d.toISOString().slice(0,10);pts.push([d.toLocaleString("en-IN",{weekday:"short"}).slice(0,2),ex.filter(t=>t.date===k).reduce((a,t)=>a+t.amt,0)])}}
 const mx=Math.max(1,...pts.map(p=>p[1]));
 return`<div class="box"><div class="row"><b class="sp">Spending trend</b><button class="chip ${M?"":"on"}" onclick="window._tr='d';render()">7 days</button><button class="chip ${M?"on":""}" onclick="window._tr='m';render()">6 months</button></div><div class="bars">${pts.map((p,i)=>`<div><span class="mute" style="font-size:10px">${p[1]?Math.round(p[1]).toLocaleString("en-IN"):""}</span><i data-h="${p[1]/mx*78}" style="${i===pts.length-1?"background:var(--lime);border:2px solid var(--line)":""}"></i><span class="mute">${p[0]}</span></div>`).join("")}</div></div>`}
function goalsHtml(){const g=S.goals||[];return`<h2 style="margin:18px 0 12px">Savings goals</h2>${g.map(x=>{const p=Math.min(1,x.saved/x.target);return`<div class="box"><div class="row"><b class="sp">${x.name}</b><span class="mute">${inr(x.saved)} of ${inr(x.target)}</span></div><div class="bar"><i data-w="${p*100}" style="background:${p>=1?"var(--ok)":"var(--ink)"}"></i></div><div class="row" style="margin-top:10px"><button class="btn sm" onclick="goalAdd(${x.id})">Add money</button><button class="btn sm alt" onclick="goalDel(${x.id})">Delete</button></div></div>`}).join("")||'<div class="box mute">Saving for something? Set a goal and watch it fill up.</div>'}<button class="btn" onclick="goalSheet()">+ New goal</button>`}
function goalSheet(){sheet(`<h3>New savings goal</h3><input id="gn" placeholder="What are you saving for?"><input id="a" class="amt" type="number" inputmode="decimal" placeholder="Target ₹0"><br><button class="btn" onclick="saveGoal()">Create goal</button>`)}
function saveGoal(){const n=$("#gn").value.trim(),a=+$("#a").value;if(!n||!(a>0))return toast("Enter a name and a target above 0",1);(S.goals=S.goals||[]).push({id:Date.now(),name:n,target:a,saved:0});save();closeSheet();render()}
function goalAdd(id){const x=S.goals.find(g=>g.id===id);sheet(`<h3>Add to ${x.name}</h3><p class="mute">This money is set aside and leaves your balance. ${inr(x.target-x.saved)} to go.</p><input id="a" class="amt" type="number" inputmode="decimal" placeholder="₹0"><label>Take it from</label><select id="s"><option>Bank</option><option>Cash</option></select><br><button class="btn" onclick="goalPut(${id})">Set aside</button>`)}
function goalPut(id){const x=S.goals.find(g=>g.id===id),a=+$("#a").value,s=$("#s").value;if(!(a>0))return toast("Enter an amount above 0",1);if(a>(s==="Cash"?S.cash:S.bank))return toast(`Not enough in ${s}`,1);bal(s,-a);x.saved+=a;save();closeSheet();if(x.saved>=x.target){confetti();toast("Goal reached: "+x.name)}render()}
function goalDel(id){const x=S.goals.find(g=>g.id===id);if(confirm(`Delete this goal? ${inr(x.saved)} goes back to your bank balance.`)){bal("Bank",x.saved);S.goals=S.goals.filter(g=>g!==x);save();render()}}
function catSheet(){sheet(`<h3>Custom categories</h3>${(S.cats||[]).map((c,i)=>`<div class="tx row"><i class="dot" style="background:${c.c};width:22px;height:22px"></i><b class="sp">${c.n}</b><button class="btn sm alt" onclick="catDel(${i})">Remove</button></div>`).join("")||'<div class="mute">None yet.</div>'}<br><input id="cn" maxlength="14" placeholder="New category (e.g. Gym, Mom)"><br><button class="btn" onclick="catAdd()">Add category</button>`)}
function catAdd(){const n=$("#cn").value.trim();if(!n)return toast("Enter a category name",1);if(CATS.some(c=>c[0].toLowerCase()===n.toLowerCase()))return toast("That category already exists",1);const c=["#E86A5E","#5E9BE8","#B27DE8","#6FCF97","#E8B04A","#E87DB5"][(S.cats||[]).length%6];(S.cats=S.cats||[]).push({n,c});CATS.push([n,c]);save();catSheet()}
function catDel(i){const c=S.cats.splice(i,1)[0],j=CATS.findIndex(x=>x[0]===c.n);if(j>7)CATS.splice(j,1);save();catSheet()}
// ===== Edit =====
function editTx(id){const t=S.tx.find(x=>x.id===id);if(!t)return;form={cat:t.cat};const inc=t.type==="in",c=t.method==="Cash";sheet(`<h3>Edit ${inc?"income":"expense"}</h3><input id="a" class="amt" type="number" inputmode="decimal" value="${t.amt}">${inc?"":chips()}<input id="n" value="${(t.note||"").replace(/"/g,"&quot;")}" placeholder="Note"><select id="m"><option ${c?"":"selected"}>Bank</option><option ${c?"selected":""}>Cash</option></select><input id="d" type="date" value="${t.date}"><br><button class="btn" onclick="saveEdit(${id})">Save changes</button><br><br><button class="btn alt" onclick="closeSheet();delTx(${id})">Delete</button>`)}
function saveEdit(id){const t=S.tx.find(x=>x.id===id),a=+$("#a").value;if(!(a>0))return toast("Enter an amount above 0",1);const sg=t.type==="in"?1:-1;if(t.status==="paid")bal(t.method==="Cash"?"Cash":"Bank",-sg*t.amt);t.amt=a;t.note=$("#n").value;t.method=$("#m").value;t.date=$("#d").value||t.date;if(t.type!=="in")t.cat=form.cat;if(t.status==="paid")bal(t.method,sg*t.amt);save();closeSheet();render()}
// ===== Recurring =====
function recSheet(){form={cat:"Bills"};sheet(`<h3>Recurring expenses</h3><p class="mute">Added automatically once a month when you open the app.</p>${(S.rec||[]).map(r=>`<div class="tx row"><div class="sp"><b>${r.note||r.cat}</b><div class="mute">${inr(r.amt)} on day ${r.day} · ${r.method}</div></div><button class="btn sm alt" onclick="delRec(${r.id})">Remove</button></div>`).join("")||'<div class="mute">None yet.</div>'}<br><b>Add new</b><input id="a" type="number" inputmode="decimal" placeholder="Amount in ₹"><input id="n" placeholder="Name (e.g. Rent, Netflix)">${chips()}<input id="dy" type="number" min="1" max="28" placeholder="Day of month (1-28)"><select id="m"><option>Bank</option><option>Cash</option></select><br><button class="btn" onclick="saveRec()">Add recurring</button>`)}
function saveRec(){const a=+$("#a").value,d=+$("#dy").value;if(!(a>0)||!(d>=1&&d<=28))return toast("Enter an amount and a day from 1 to 28",1);(S.rec=S.rec||[]).push({id:Date.now(),amt:a,cat:form.cat,note:$("#n").value,day:d,method:$("#m").value,last:""});save();runRec();recSheet()}
function delRec(id){S.rec=S.rec.filter(r=>r.id!==id);save();recSheet()}
function runRec(){let n=0;(S.rec||[]).forEach(r=>{if(r.last!==mk(today())&&new Date().getDate()>=r.day){r.last=mk(today());addExp({id:Date.now()+n++,amt:r.amt,cat:r.cat,note:r.note,date:today(),method:r.method,status:"paid"})}});if(n)toast(n+" recurring expense"+(n>1?"s":"")+" added")}
// ===== Backup =====
function backSheet(){sheet(`<h3>Backup and restore</h3><p class="mute">Copy this text and keep it safe, for example by sending it to yourself. To restore on a new phone, paste it in the box below.</p><textarea id="bk" readonly>${JSON.stringify(S).replace(/</g,"\\u003c")}</textarea><br><br><button class="btn sm" onclick="$('#bk').select();document.execCommand('copy');toast('Backup copied')">Copy backup</button><br><br><label>Restore from backup</label><textarea id="rs" placeholder="Paste backup text here"></textarea><br><button class="btn alt" onclick="restore()">Restore data</button>`)}
function restore(){try{const d=JSON.parse($("#rs").value);if(!Array.isArray(d.tx)||!Array.isArray(d.loans))throw 0;if(!confirm("Replace all current data with this backup?"))return;S=d;CATS.length=8;(S.cats||[]).forEach(x=>CATS.push([x.n,x.c]));S.setup=true;S.pending=null;save();closeSheet();nav();render();toast("Data restored")}catch(e){toast("That backup text isn't valid",1)}}
// ===== Add =====
const pickCat=c=>{form.cat=c;document.querySelectorAll("[data-c]").forEach(e=>e.classList.toggle("on",e.dataset.c===c))};
const chips=()=>`<div class="chips">${CATS.map(c=>`<button class="chip ${form.cat===c[0]?"on":""}" data-c="${c[0]}" onclick="pickCat('${c[0]}')">${c[0]}</button>`).join("")}</div>`;
function openAdd(){form={cat:"Food"};sheet(`<h3>Add transaction</h3><select id="ty"><option value="out">Expense</option><option value="in">Income</option></select><input id="a" class="amt" type="number" inputmode="decimal" placeholder="₹0">${chips()}<input id="n" placeholder="Note (optional)"><label>Paid from / received in</label><select id="m"><option>Bank</option><option>Cash</option></select><br><button class="btn" onclick="saveAdd()">Save</button>`)}
function saveAdd(){const a=+$("#a").value;if(!(a>0))return toast("Enter an amount above 0",1);const inc=$("#ty").value==="in",m=$("#m").value;if(inc){S.tx.push({id:Date.now(),amt:a,cat:"Income",note:$("#n").value||"Income",date:today(),method:m,type:"in",status:"paid"});bal(m,a);save()}else addExp({id:Date.now(),amt:a,cat:form.cat,note:$("#n").value,date:today(),method:m,status:"paid"});closeSheet();go("home")}
// ===== Lending =====
function lendSheet(){form={src:"Bank"};sheet(`<h3>${window._k==="b"?"Money you borrowed":"Money you lent"}</h3><input id="w" placeholder="Person's name"><input id="ph" type="tel" placeholder="Phone (for WhatsApp reminder, optional)"><input id="a" class="amt" type="number" inputmode="decimal" placeholder="₹0"><label>${window._k==="b"?"Pay back by":"Remind me to ask on"}</label><input id="du" type="date" min="${today()}"><input id="n" placeholder="Note (e.g. for tickets)"><label>${window._k==="b"?"Received in":"Given from"}</label><select id="s"><option>Bank</option><option>Cash</option></select><br><button class="btn" onclick="saveLoan()">Save</button>`)}
function saveLoan(){const w=$("#w").value.trim(),a=+$("#a").value;if(!w||!(a>0))return toast("Enter a name and an amount above 0",1);const s=$("#s").value;S.loans.push({id:Date.now(),who:w,phone:$("#ph").value.replace(/\D/g,""),amt:a,date:today(),due:$("#du").value,note:$("#n").value,src:s,pay:[],k:window._k==="b"?"b":"l"});bal(s,window._k==="b"?a:-a);save();closeSheet();render()}
function recvSheet(id){const l=S.loans.find(x=>x.id===id);sheet(`<h3>${l.k==="b"?"Paid back to":"Money back from"} ${l.who}</h3><p class="mute">${l.k==="b"?"You still owe":"They still owe"} ${inr(left(l))}</p><input id="a" class="amt" type="number" inputmode="decimal" value="${left(l)}"><label>${l.k==="b"?"Paid from":"Received in"}</label><select id="s"><option>Bank</option><option>Cash</option></select><br><button class="btn" onclick="recv(${id})">Save</button>`)}
function recv(id){const l=S.loans.find(x=>x.id===id),a=+$("#a").value;if(!(a>0)||a>left(l))return toast("Enter an amount up to "+inr(left(l)),1);l.pay.push({amt:a,date:today()});bal($("#s").value,l.k==="b"?-a:a);save();closeSheet();if(left(l)<=0){confetti();toast(l.k==="b"?"You cleared your debt to "+l.who:l.who+" has paid you back in full")}render()}
function nudge(id){const l=S.loans.find(x=>x.id===id),m=`Hi ${l.who}, a gentle reminder about the ${inr(left(l))} I lent you${l.note?" ("+l.note+")":""}. Please send it when you can. Thanks!`;if(l.phone)open_("https://wa.me/"+(l.phone.length===10?"91":"")+l.phone+"?text="+encodeURIComponent(m));else if(navigator.share)navigator.share({text:m}).catch(()=>{});else{navigator.clipboard?.writeText(m);toast("Reminder text copied")}}
const open_=u=>window.open(u,"_blank");
function delLoan(id){const l=S.loans.find(x=>x.id===id);if(confirm(`Delete this record? ${inr(l.amt)} will be added back to your ${l.src} balance only if nothing was received.`)){if(!l.pay.length)bal(l.src,l.k==="b"?-l.amt:l.amt);S.loans=S.loans.filter(x=>x!==l);save();render()}}
// ===== Boot =====
theme(ls("ht"));const em=ls("hs"),us=ls("hu")||{};em&&us[em]?start(em):authView("up");
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
